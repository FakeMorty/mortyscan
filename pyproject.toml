[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mortyscan"
version = "20.0.0"
description = "Authorized web security auditing toolkit"
requires-python = ">=3.10"
dependencies = [
  "fpdf2",
  "scapy",
  "requests",
  "httpx",
  "typer[all]",
  "rich",
  "beautifulsoup4",
  "dnspython",
  "lxml",
  "tldextract",
  "Flask",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
api = ["schemathesis>=4.0"]
tls = ["sslyze>=6.3,<7"]

[tool.setuptools.packages.find]
include = ["mortyscan*"]

[tool.setuptools.package-data]
mortyscan = ["data/*.txt", "data/*.yaml"]
